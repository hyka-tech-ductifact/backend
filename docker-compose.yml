# Development compose — two modes:
#   make services-start → postgres + s3 + redis + mailpit (dev, app runs on host with air)
#   make docker-start  → same + app in Docker (smoke test)
#   make docker-stop   → stop everything

services:
  postgres:
    image: postgres:15-alpine@sha256:df7bca0066e6f60cc3dd32faa70caddec20e2c22b58932f79498e5704b23854a
    container_name: ductifact_dev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage, served by RustFS. The service is named after the
  # protocol so S3_HOST does not change with the server; the volume is server-specific.
  # Console: http://localhost:${S3_CONSOLE_PORT}
  s3:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    container_name: ductifact_dev_s3
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "${S3_PORT}:9000" # S3 API
      - "${S3_CONSOLE_PORT}:9001" # Web console
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:9000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: ductifact_dev_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # MailPit — development-only SMTP server that captures all outgoing emails.
  # Web UI: http://localhost:8025 — never deployed to production.
  mailpit:
    image: axllent/mailpit@sha256:39d85ed667e643ad5578cfd9f4e0d9877c32f5c7e6284636254b5b605c23a712
    container_name: ductifact_dev_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI (http://localhost:8025)
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8025/" ]
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    profiles: [ smoke ]
    build: .
    container_name: ductifact_dev_app
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - BACKEND_PORT=8080
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_FORMAT=${LOG_FORMAT}
      - BACKEND_HOST=${BACKEND_HOST}
      - JWT_ACCESS_TOKEN_TTL_SECONDS=${JWT_ACCESS_TOKEN_TTL_SECONDS}
      - JWT_REFRESH_TOKEN_TTL_SECONDS=${JWT_REFRESH_TOKEN_TTL_SECONDS}
      - GIN_MODE=${GIN_MODE}
      - RATE_LIMIT_IP_MAX=${RATE_LIMIT_IP_MAX}
      - RATE_LIMIT_IP_WINDOW_SECONDS=${RATE_LIMIT_IP_WINDOW_SECONDS}
      - RATE_LIMIT_USER_MAX=${RATE_LIMIT_USER_MAX}
      - RATE_LIMIT_USER_WINDOW_SECONDS=${RATE_LIMIT_USER_WINDOW_SECONDS}
      - LOGIN_THROTTLE_MAX_ATTEMPTS=${LOGIN_THROTTLE_MAX_ATTEMPTS}
      - LOGIN_THROTTLE_WINDOW_SECONDS=${LOGIN_THROTTLE_WINDOW_SECONDS}
      - LOGIN_THROTTLE_LOCKOUT_SECONDS=${LOGIN_THROTTLE_LOCKOUT_SECONDS}
      - S3_HOST=s3
      - S3_PORT=9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - S3_USE_SSL=false
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_AUTH=${SMTP_AUTH}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - VERIFICATION_REGISTRATION_OTP_TTL_SECONDS=${VERIFICATION_REGISTRATION_OTP_TTL_SECONDS}
      - VERIFICATION_PASSWORD_RESET_OTP_TTL_SECONDS=${VERIFICATION_PASSWORD_RESET_OTP_TTL_SECONDS}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_AUTH=${REDIS_AUTH}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB}
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  rustfs_data:
  redis_data:
