# ─── User Endpoints ──────────────────────────────────────────

# GET /users/me + PUT /users/me + DELETE /users/me
me:
  get:
    summary: Get authenticated user's profile
    operationId: getMe
    tags:
      - Users
    security:
      - bearerAuth: []
    responses:
      "200":
        description: User profile returned
        content:
          application/json:
            schema:
              $ref: "../schemas/user.yaml#/UserResponse"
      "401":
        description: Missing or invalid token
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"

  put:
    summary: Update authenticated user's profile
    operationId: updateMe
    tags:
      - Users
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/user.yaml#/UpdateUserRequest"
          example:
            name: "Pedro López"
    responses:
      "200":
        description: User updated successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/user.yaml#/UserResponse"
      "400":
        description: Invalid request body
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"
      "401":
        description: Missing or invalid token
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"
      "409":
        description: Email already in use
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"
            example:
              error: "email already in use"

  delete:
    summary: Delete authenticated user's account (GDPR)
    description: Permanently deletes the user account and all associated data (clients, projects, orders, pieces). This action is irreversible. Requires cascade=true if the user has associated clients.
    operationId: deleteMe
    tags:
      - Users
    security:
      - bearerAuth: []
    parameters:
      - name: cascade
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Set to true to confirm deletion of all associated data (clients, projects, orders, pieces)
    responses:
      "200":
        description: Account deleted successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/auth.yaml#/MessageResponse"
            example:
              message: "account deleted successfully"
      "401":
        description: Missing or invalid token
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"
      "409":
        description: User has associated data and cascade was not set to true
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"
            example:
              error: "user has associated clients; set cascade=true to delete"
